name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SmartFileOrganizer.slnx

      - name: Build
        run: dotnet build SmartFileOrganizer.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SmartFileOrganizer.slnx --no-build --configuration Release --logger "console;verbosity=normal"

      # The evaluation with scripted answers instead of a model (docs/evaluation.md). The tests
      # check the failures it names; this step shows the scores of the shipped CLI in the log.
      - name: Evaluation with scripted answers
        shell: bash
        run: |
          sfo() { dotnet src/SmartFileOrganizer.Cli/bin/Release/net10.0/sfo.dll "$@" --db "$RUNNER_TEMP/eval/data.db" --progress none; }
          sfo eval generate "$RUNNER_TEMP/eval/corpus"
          sfo eval "$RUNNER_TEMP/eval/corpus" --stub "$RUNNER_TEMP/eval/corpus/truth.json"
